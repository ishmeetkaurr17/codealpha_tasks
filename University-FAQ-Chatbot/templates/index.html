<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>University FAQ Chatbot</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="chat-container">

        <!-- Header -->
        <div class="chat-header">

            <div class="bot-icon">
                AI
            </div>

            <div class="header-text">
                <h1>University Chatbot</h1>

                <div class="online-status">
                    <span></span>
                    Online
                </div>
            </div>

        </div>


        <!-- Chat Area -->
        <div class="chat-box">

            <div class="welcome-section">

                <div class="welcome-icon">
                    AI
                </div>

                <h2>Hello! How can I help?</h2>

                <p>
                    Ask me anything about the university,
                    including admissions, exams, attendance and more.
                </p>

            </div>


            <!-- Frequently Asked Questions -->
            <div class="faq-section">

                <p class="section-title">
                    Frequently asked
                </p>

                <div class="quick-questions">

                    <button>College timings</button>

                    <button>Admission process</button>

                    <button>Exam schedule</button>

                    <button>Contact college</button>

                    <button>Attendance</button>

                    <button>Library timings</button>

                </div>

            </div>

        </div>


        <!-- Language Selection -->
        <div class="language-area">

            <label for="language">
                Language
            </label>

            <select id="language">

                <option value="auto">Auto Detect</option>

                <option value="en">English</option>
                <option value="hi">Hindi</option>
                <option value="pa">Punjabi</option>
                <option value="bn">Bengali</option>
                <option value="gu">Gujarati</option>
                <option value="mr">Marathi</option>
                <option value="ta">Tamil</option>
                <option value="te">Telugu</option>
                <option value="kn">Kannada</option>
                <option value="ml">Malayalam</option>

                <option value="fr">French</option>
                <option value="es">Spanish</option>
                <option value="de">German</option>
                <option value="it">Italian</option>
                <option value="pt">Portuguese</option>

            </select>

        </div>


        <!-- Message Input -->
        <div class="input-area">

            <input
                type="text"
                placeholder="Ask your question..."
            >

            <button class="send-button">
                Send
            </button>

        </div>


        <!-- Footer -->
        <div class="footer-text">
            University FAQ Assistant
        </div>

    </div>

    <!-- Feedback -->
<div class="feedback-section" id="feedback-section">

    <p class="feedback-title">
        Was this chatbot helpful?
    </p>

    <div class="rating">

        <button data-rating="1">1</button>
        <button data-rating="2">2</button>
        <button data-rating="3">3</button>
        <button data-rating="4">4</button>
        <button data-rating="5">5</button>

    </div>

    <button class="feedback-submit" id="feedback-submit">
        Submit Feedback
    </button>

    <p class="feedback-message" id="feedback-message"></p>
    <p class="conversation-closed" id="conversation-closed">
    Conversation closed
</p>
</div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
