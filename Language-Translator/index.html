
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translation Tool</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>
            <h1>Language Translator</h1>
            <p class="subtitle">
                A simple way to understand every language.
            </p>
        </header>

        <section class="translator">

            <div class="language-section">

                <label class="language-box">
                    <span>Translate from</span>
                    <select id="sourceLang">
                        <option value="en">English</option>
                        <option value="hi">Hindi</option>
                        <option value="pa">Punjabi</option>
                        <option value="fr">French</option>
                        <option value="es">Spanish</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                        <option value="ja">Japanese</option>
                        <option value="zh">Chinese</option>
                        <option value="ar">Arabic</option>
                    </select>
                </label>

                <button id="swapBtn" type="button"
                    aria-label="Swap languages" title="Swap languages">
                    ⇄
                </button>

                <label class="language-box">
                    <span>Translate to</span>
                    <select id="targetLang">
                        <option value="hi">Hindi</option>
                        <option value="en">English</option>
                        <option value="pa">Punjabi</option>
                        <option value="fr">French</option>
                        <option value="es">Spanish</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                        <option value="ja">Japanese</option>
                        <option value="zh">Chinese</option>
                        <option value="ar">Arabic</option>
                    </select>
                </label>

            </div>

            <div class="text-section">

                <div class="text-panel">
                    <label for="inputText">Your text</label>
                    <textarea
                        id="inputText"
                        placeholder="Enter the text you want to translate..."
                        maxlength="5000"></textarea>
                </div>

                <div class="text-panel">
                    <label for="outputText">Translated text</label>
                    <textarea
                        id="outputText"
                        placeholder="Your translation will appear here..."
                        readonly></textarea>
                </div>

            </div>

            <button id="translateBtn" type="button">
                Translate
            </button>

            <div class="actions">

                <button id="copyBtn" type="button">
                    Copy translation
                </button>

                <button id="speakBtn" type="button">
                    Listen
                </button>

            </div>

            <p id="status" role="status" aria-live="polite"></p>

        </section>

        <footer>
            <p>Language Translation Tool | Student Project</p>
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
